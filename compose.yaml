services:
  syncria:
    image: ghcr.io/gigabytegrove/syncria:latest
    container_name: syncria
    restart: unless-stopped
    ports:
      - "${SYNCRIA_BIND_IP:-127.0.0.1}:9764:9764"
    volumes:
      # Configuration, credentials, update history and sync indexes only.
      # No application file payloads and no NAS bind mounts.
      - "${SYNCRIA_DATA_DIR:-./data}:/data"
    stop_grace_period: 1m
