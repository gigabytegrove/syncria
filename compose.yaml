services:
  syncria:
    build:
      context: .
      dockerfile: Dockerfile
    image: syncria:local
    container_name: syncria
    restart: unless-stopped
    ports:
      - "${SYNCRIA_BIND_IP:-127.0.0.1}:9764:9764"
    volumes:
      - "${SYNCRIA_DATA_DIR:-./data}:/data"
      # Expose ONE storage root, not individual NAS shares.
      # Syncria manages account/folder mappings dynamically in its web UI.
      - type: bind
        source: ${SYNCRIA_STORAGE_ROOT:-/mnt}
        target: /storage
        bind:
          create_host_path: false
          propagation: rslave
    stop_grace_period: 1m
