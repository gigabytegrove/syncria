name: Verify Syncria v0.5.0
on:
  push:
    branches: [syncria-v0.5.0-work]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: false
      - name: Verify tests and compilation
        run: |
          set -euo pipefail
          go mod tidy
          go test -count=1 ./...
          go test -race -count=1 ./...
          go vet ./...
          CGO_ENABLED=0 go build -o /tmp/syncria-test .
          /tmp/syncria-test -h >/dev/null
