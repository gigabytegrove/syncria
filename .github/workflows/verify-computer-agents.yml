name: Verify Connected Computers (preview builds)

on:
  pull_request:
    paths:
      - 'computer_*.go'
      - 'main.go'
      - 'ui.go'
      - 'docs/CONNECTED-COMPUTERS.md'
      - '.github/workflows/verify-computer-agents.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  computer-agents:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: false
      - name: Compile and verify Syncria UI
        run: |
          npm install --no-audit --no-fund
          npm run build:css
      - name: Agent integration, race and static checks
        run: |
          go mod tidy
          go test -count=1 -run 'TestComputer' ./...
          go test -race -count=1 ./...
          go vet ./...
      - name: Preview binaries for native agents
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          for target in linux/amd64 linux/arm64 windows/amd64 windows/arm64; do
            os="${target%/*}"
            arch="${target#*/}"
            suffix=""
            if [ "$os" = windows ]; then suffix=".exe"; fi
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" go build -trimpath               -ldflags="-s -w -X main.appVersion=v0.8.6-dev"               -o "dist/syncria-${os}-${arch}${suffix}" .
          done
          (cd dist && sha256sum syncria-* > SHA256SUMS)
          (cd dist && sha256sum -c SHA256SUMS)
      - name: Start and probe real native Linux agent
        shell: bash
        run: |
          set -euo pipefail
          root="$(mktemp -d)"
          mkdir -p "$root/documents"
          printf 'Syncria agent smoke test\n' > "$root/documents/hello.txt"
          dist/syncria-linux-amd64 -agent -listen 127.0.0.1:19865 \
            -agent-data "$root/identity" -agent-name "CI agent" \
            -agent-root "Documents=$root/documents" > "$root/agent.log" 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true; wait "$pid" 2>/dev/null || true; rm -rf "$root"' EXIT
          for i in $(seq 1 80); do
            if test -s "$root/identity/identity.json"; then
              if curl -ks --max-time 2 https://127.0.0.1:19865/v1/status -o /dev/null; then break; fi
            fi
            sleep 0.25
          done
          token="$(python3 -c 'import json,sys;print(json.load(open(sys.argv[1]))["secret"])' "$root/identity/identity.json")"
          curl --fail --silent --show-error --insecure --max-time 10 \
            -H "Authorization: Bearer $token" \
            https://127.0.0.1:19865/v1/status > "$root/status.json"
          python3 - "$root/status.json" <<'PY'
          import json,sys
          v=json.load(open(sys.argv[1]))
          assert v["name"] == "CI agent"
          assert v["roots"][0]["name"] == "Documents"
          print("PASS: native TLS agent started and listed its configured root")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: syncria-computer-agent-preview
          path: dist/
          retention-days: 7
