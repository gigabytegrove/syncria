name: Verify Syncria v0.5.1
on:
  push:
    branches: [syncria-v0.5.1-ui-updater]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: false
      - name: Compile, unit and race tests
        run: |
          set -euo pipefail
          go mod tidy
          go test -count=1 ./...
          go test -race -count=1 ./...
          go vet ./...
          CGO_ENABLED=0 go build -trimpath -o /tmp/syncria-v051 .
          /tmp/syncria-v051 -h >/dev/null
